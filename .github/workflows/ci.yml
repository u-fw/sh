name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Syntax check
        working-directory: network
        run: |
          for f in freedom.sh vps_init_tool.sh xray-1stream-dat.sh verify.sh; do
            bash -n "$f"
          done

      # Default (strictest) severity, no per-file exemptions. If this trips,
      # fix the finding rather than lowering the gate.
      - name: Lint
        working-directory: network
        run: shellcheck freedom.sh vps_init_tool.sh xray-1stream-dat.sh verify.sh

      # VERIFY_STRICT turns every "could not check" into a failure, so no part
      # of the suite can silently skip its way to green in CI.
      - name: Verification suite
        working-directory: network
        env:
          VERIFY_STRICT: '1'
        run: bash verify.sh
    timeout-minutes: 15

  powershell:
    name: powershell static (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NTFS cannot validate POSIX permission bits. Runtime gates stay strict
      # in the Linux jobs; Windows executes the native static assertions.
      - name: PowerShell static assertions
        working-directory: network
        env:
          VERIFY_STRICT: '1'
        shell: powershell
        run: .\verify.ps1 -StaticOnly
    timeout-minutes: 15

  powershell-runtime:
    name: powershell entry point (linux runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
      - name: Strict PowerShell entry point
        working-directory: network
        env:
          VERIFY_STRICT: '1'
        shell: pwsh
        run: ./verify.ps1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
